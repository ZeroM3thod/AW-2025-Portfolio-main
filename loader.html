<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AW 2025 - Standalone Loader</title>
    <style>
        :root {
            --color-primary: #f40c3f;
            --color-secondary: #160000;
            --border-width: 1rem;
            
            /* Easings */
            --ease-in-out: cubic-bezier(0.85, 0, 0.15, 1); /* power4.inOut */
            --ease-in: cubic-bezier(0.895, 0.03, 0.685, 0.22); /* power4.in */
            --ease-border: cubic-bezier(0.645, 0.045, 0.355, 1); /* power3.inOut */
        }

        @media (max-width: 768px) {
            :root {
                --border-width: 0.5rem;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #160000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
        }

        .site-intro {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 50;
            width: 100%;
            height: 100%;
            background: var(--color-primary);
        }

        /* Logo Container */
        .sb-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 3rem;
            height: 3rem;
            transform: translate3d(-50%, -50%, 0);
        }

        @media (max-width: 768px) {
            .sb-logo {
                width: 1.875rem;
                height: 1.875rem;
            }
        }

        .sb__path {
            position: absolute;
            background: var(--color-secondary);
        }

        /* Vertical Lines */
        .sb__path--v {
            top: 0;
            width: 14.2857%;
            height: 100%;
            transform: scaleY(0);
        }

        .v-line-in-out {
            animation: 
                v-in 1s var(--ease-in-out) forwards,
                v-out 1s var(--ease-in) forwards;
        }

        @keyframes v-in {
            0% { transform: scaleY(0); transform-origin: 50% 100%; }
            100% { transform: scaleY(1); transform-origin: 50% 100%; }
        }

        @keyframes v-out {
            0% { transform: scaleY(1); transform-origin: 50% 0%; }
            100% { transform: scaleY(0); transform-origin: 50% 0%; }
        }

        .sb__path--v-1 { left: 0; --delay-in: 0s; --delay-out: 2s; }
        .sb__path--v-2 { left: 21.3214%; --delay-in: 0.15s; --delay-out: 2.1s; }
        .sb__path--v-3 { left: 43.2143%; --delay-in: 0.3s; --delay-out: 2.2s; }
        .sb__path--v-4 { left: 64.7857%; --delay-in: 0.45s; --delay-out: 2.3s; }
        .sb__path--v-5 { right: 0; --delay-in: 0.6s; --delay-out: 2.4s; }

        .sb__path--v {
            animation-delay: var(--delay-in), var(--delay-out);
        }

        /* Horizontal Lines */
        .sb__path--h {
            width: 7.5%;
            height: 6%;
            transform: scaleX(0);
        }

        @keyframes h-in {
            to { transform: scaleX(1); }
        }

        @keyframes h-out {
            0% { transform: scaleY(1); }
            100% { transform: scaleY(0); }
        }

        .sb__path--h-1 {
            top: 0;
            left: 14.2857%;
            transform-origin: 100% 0;
            animation: 
                h-in 0.4s var(--ease-in-out) forwards 1s,
                h-out 0.5s var(--ease-in) forwards 2.1s;
        }

        .sb__path--h-2 {
            left: 57.5%;
            bottom: 0;
            transform-origin: 0 0;
            animation: 
                h-in 0.4s var(--ease-in-out) forwards 1s,
                h-out 0.5s var(--ease-in) forwards 2.2s;
        }

        .sb__path--h-3 {
            right: 14.2857%;
            bottom: 0;
            transform-origin: 0% 0;
            animation: 
                h-in 0.4s var(--ease-in-out) forwards 1s,
                h-out 0.5s var(--ease-in) forwards 2.3s;
        }

        /* Borders */
        .site-intro__border {
            position: absolute;
            background: var(--color-secondary);
        }

        .site-intro__border--top {
            top: 0;
            left: 0;
            width: 100%;
            height: var(--border-width);
            transform: scaleY(0);
            transform-origin: 50% 0;
            animation: border-in-out 3s var(--ease-border) forwards 1s;
        }

        .site-intro__border--left,
        .site-intro__border--right {
            top: 0;
            width: var(--border-width);
            height: 100%;
            transform: scaleX(0);
        }

        .site-intro__border--left {
            left: 0;
            transform-origin: 0 50%;
            animation: border-in-out 3s var(--ease-border) forwards 1s;
        }

        .site-intro__border--right {
            right: 0;
            transform-origin: 100% 50%;
            animation: border-in-out 3s var(--ease-border) forwards 1s;
        }

        @keyframes border-in-out {
            to { transform: scale(1); }
        }

        /* Controls */
        .replay-btn {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            padding: 0.75rem 1.5rem;
            background: var(--color-secondary);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .replay-btn:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="site-intro" id="intro">
        <div class="sb-logo">
            <div class="sb__path sb__path--v sb__path--v-1 v-line-in-out"></div>
            <div class="sb__path sb__path--h sb__path--h-1"></div>
            <div class="sb__path sb__path--v sb__path--v-2 v-line-in-out"></div>
            <div class="sb__path sb__path--v sb__path--v-3 v-line-in-out"></div>
            <div class="sb__path sb__path--h sb__path--h-2"></div>
            <div class="sb__path sb__path--v sb__path--v-4 v-line-in-out"></div>
            <div class="sb__path sb__path--h sb__path--h-3"></div>
            <div class="sb__path sb__path--v sb__path--v-5 v-line-in-out"></div>
        </div>

        <div class="site-intro__border site-intro__border--top"></div>
        <div class="site-intro__border site-intro__border--left"></div>
        <div class="site-intro__border site-intro__border--right"></div>
    </div>

    <button class="replay-btn" onclick="replay()">Replay Animation</button>

    <script>
        function replay() {
            const intro = document.getElementById('intro');
            const clone = intro.cloneNode(true);
            intro.parentNode.replaceChild(clone, intro);
        }
    </script>
</body>
</html>
